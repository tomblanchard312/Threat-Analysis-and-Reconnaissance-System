# Axolotl Configuration for HTB Pentest Model Training
# Fine-tune Mistral 7B with QLoRA on HTB writeups
#
# Usage:
#   accelerate launch -m axolotl.cli.train axolotl_config.yaml

# Base model configuration
base_model: mistralai/Mistral-7B-v0.3
model_type: MistralForCausalLM
tokenizer_type: LlamaTokenizer
trust_remote_code: true

# Load in 4-bit for QLoRA
load_in_8bit: false
load_in_4bit: true

# Dataset configuration
datasets:
  - path: ../data/training/htb_chatml.json
    type: sharegpt
    conversation: chatml

# Output configuration
output_dir: ../output/htb-mistral-7b-qlora
hub_model_id:  # Leave empty to not push to HuggingFace

# Training hyperparameters
sequence_len: 4096
sample_packing: true
pad_to_sequence_len: true

# QLoRA configuration
adapter: qlora
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_linear: true
lora_fan_in_fan_out: false

# Training parameters
gradient_accumulation_steps: 4
micro_batch_size: 2
num_epochs: 3
learning_rate: 0.0002
lr_scheduler: cosine
warmup_ratio: 0.1
optimizer: adamw_bnb_8bit

# Regularization
weight_decay: 0.01
max_grad_norm: 1.0

# Precision
bf16: auto
fp16: false
tf32: true

# Logging and checkpoints
logging_steps: 10
save_steps: 100
eval_steps: 100
save_total_limit: 3

# Evaluation
val_set_size: 0.05
eval_sample_packing: false

# Performance optimizations
gradient_checkpointing: true
flash_attention: true

# Weights & Biases logging (optional)
wandb_project: htb-pentest-model
wandb_entity:  # Your W&B username
wandb_run_id:
wandb_log_model:

# DeepSpeed (for multi-GPU)
# deepspeed: deepspeed_configs/zero2.json

# Special tokens
special_tokens:
  pad_token: "<pad>"

# Chat template
chat_template: chatml

# Early stopping
early_stopping_patience: 3

# Seed for reproducibility
seed: 42
