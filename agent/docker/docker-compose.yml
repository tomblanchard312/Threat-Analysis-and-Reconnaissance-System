services:
  kali:
    build:
      context: .
      dockerfile: Dockerfile
    image: htb-pentest-kali:latest
    container_name: htb-kali
    hostname: kali

    # Keep container running
    stdin_open: true
    tty: true

    # Network configuration
    network_mode: host  # Direct access to host network for scanning

    # Mount points for persistence
    volumes:
      # Persist pentest data between sessions
      - kali-data:/pentest
      # Share files with host (optional)
      - ./shared:/shared
      # Metasploit database
      - msf-data:/root/.msf4

    # Resource limits (adjust based on your system)
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G

    # Security options for pentest tools
    cap_add:
      - NET_ADMIN      # Network administration (for raw sockets)
      - NET_RAW        # Raw packet access (for nmap SYN scans)
      - SYS_PTRACE     # Process tracing (for debugging)

    # Restart policy
    restart: unless-stopped

volumes:
  kali-data:
    name: htb-kali-data
  msf-data:
    name: htb-msf-data
